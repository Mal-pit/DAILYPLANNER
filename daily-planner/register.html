<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DayFlow – Register a new account.">
  <title>Register – DayFlow</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-wrapper">

  <div class="auth-panel-left">
    <div class="auth-brand fade-in">
      <div class="logo-icon">📅</div>
      <h1>DayFlow</h1>
      <p>Join DayFlow and start building better habits and managing your time effectively.</p>
    </div>
    <div class="auth-features fade-in-2">
      <div class="auth-feature-item"><span class="dot"></span> Free to use, always</div>
      <div class="auth-feature-item"><span class="dot"></span> All data stored locally</div>
      <div class="auth-feature-item"><span class="dot"></span> No sign-up required for demo</div>
      <div class="auth-feature-item"><span class="dot"></span> Beautiful, distraction-free UI</div>
    </div>
  </div>

  <div class="auth-panel-right">
    <div class="auth-form-box fade-in">
      <h2>Create Account</h2>
      <p class="auth-subtitle">Set up your DayFlow planner</p>

      <div class="form-error" id="regError" style="display:none;"></div>
      <div class="form-success" id="regSuccess" style="display:none;"></div>

      <form id="registerForm" novalidate>
        <div class="form-group">
          <label for="reg_name">Full Name</label>
          <input type="text" id="reg_name" placeholder="e.g. John Doe" required>
        </div>
        <div class="form-group">
          <label for="reg_email">Email</label>
          <input type="email" id="reg_email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="reg_username">Username</label>
          <input type="text" id="reg_username" placeholder="Choose a username" required>
        </div>
        <div class="form-group">
          <label for="reg_password">Password</label>
          <input type="password" id="reg_password" placeholder="Min. 6 characters" required>
        </div>
        <button type="submit" class="btn btn-primary btn-full" style="margin-top:8px;">
          Create Account &rarr;
        </button>
      </form>

      <div class="auth-switch">
        Already have an account? <a href="index.html">Sign in here</a>
      </div>
    </div>
  </div>

</div>

<script>
  if (localStorage.getItem('dayflow_user')) {
    window.location.href = 'dashboard.html';
  }

  document.getElementById('registerForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const name     = document.getElementById('reg_name').value.trim();
    const email    = document.getElementById('reg_email').value.trim();
    const username = document.getElementById('reg_username').value.trim();
    const password = document.getElementById('reg_password').value.trim();
    const errDiv   = document.getElementById('regError');
    const sucDiv   = document.getElementById('regSuccess');
    errDiv.style.display = 'none';
    sucDiv.style.display = 'none';

    if (!name || !email || !username || !password) {
      errDiv.textContent = '⚠️ Please fill in all fields.';
      errDiv.style.display = 'flex'; return;
    }
    if (password.length < 6) {
      errDiv.textContent = '⚠️ Password must be at least 6 characters.';
      errDiv.style.display = 'flex'; return;
    }

    // Save user and auto-login
    const users = JSON.parse(localStorage.getItem('dayflow_users') || '{}');
    if (users[username]) {
      errDiv.textContent = '❌ Username already taken. Choose another.';
      errDiv.style.display = 'flex'; return;
    }

    users[username] = { password, name, email, role: 'User' };
    localStorage.setItem('dayflow_users', JSON.stringify(users));
    localStorage.setItem('dayflow_user', JSON.stringify({ username, name, role: 'User', email }));

    sucDiv.textContent = '✅ Account created! Redirecting…';
    sucDiv.style.display = 'flex';
    setTimeout(() => window.location.href = 'dashboard.html', 1200);
  });
</script>

</body>
</html>
