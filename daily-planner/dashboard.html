<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DayFlow Dashboard – Overview of your tasks, schedule and habits.">
  <title>Dashboard – DayFlow</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="app-layout">

  <div id="sidebarContainer"></div>

  <div class="main-content">
    <div id="topbarContainer"></div>

    <main class="page-content">

      <div class="fade-in" style="margin-bottom:24px;">
        <h2 style="font-size:1.65rem; margin-bottom:4px;" id="greetingMsg"></h2>
        <p style="color:var(--ink-muted); font-size:.92rem;" id="greetingDate"></p>
      </div>

      <!-- Stats -->
      <div class="stats-grid fade-in-2" id="statsGrid"></div>

      <!-- Charts row -->
      <div class="two-col fade-in-3">
        <div class="card">
          <div class="card-header">
            <h3>Task Overview</h3>
            <span class="badge badge-amber" id="completionBadge"></span>
          </div>
          <div class="card-body" style="display:flex; align-items:center; gap:28px; flex-wrap:wrap;">
            <div style="flex:0 0 200px; height:200px; position:relative;">
              <canvas id="donutChart"></canvas>
              <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;">
                <div style="font-family:'Playfair Display',serif;font-size:1.7rem;font-weight:700;color:var(--ink)" id="donutPct"></div>
                <div style="font-size:.72rem;color:var(--ink-muted);">Complete</div>
              </div>
            </div>
            <div style="flex:1; min-width:120px;" id="progressBars"></div>
          </div>
        </div>

        <div class="card">
          <div class="card-header"><h3>Tasks by Category</h3></div>
          <div class="card-body"><canvas id="barChart" style="max-height:220px;"></canvas></div>
        </div>
      </div>

      <!-- Bottom row -->
      <div class="three-col fade-in-4">

        <div class="card">
          <div class="card-header">
            <h3>Today's Tasks</h3>
            <a href="tasks.html" class="btn btn-sm btn-secondary">View All</a>
          </div>
          <div class="card-body" style="padding-top:8px;" id="todayTasksList"></div>
        </div>

        <div style="display:flex;flex-direction:column;gap:22px;">
          <div class="card">
            <div class="card-header"><h3>Calendar</h3></div>
            <div class="card-body">
              <div class="mini-calendar">
                <div class="cal-header"><h4 id="calTitle"></h4></div>
                <div class="cal-grid" id="calGrid"></div>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <h3>Top Streaks</h3>
              <a href="habits.html" class="btn btn-sm btn-secondary">All Habits</a>
            </div>
            <div class="card-body" style="padding-top:10px;" id="topStreaks"></div>
          </div>
        </div>

      </div>

    </main>
    <div id="footerContainer"></div>
  </div>
</div>

<script src="js/app.js"></script>
<script>
const user   = requireAuth();
const tasks  = getTasks();
const habits = getHabits();

// Inject layout
document.getElementById('sidebarContainer').innerHTML = renderSidebar('dashboard.html');
document.getElementById('topbarContainer').innerHTML  = renderTopbar('Dashboard');
document.getElementById('footerContainer').innerHTML  = renderFooter();

// Greeting
const hour = new Date().getHours();
const greet = hour < 12 ? 'morning' : hour < 18 ? 'afternoon' : 'evening';
const firstName = user.name.split(' ')[0];
document.getElementById('greetingMsg').textContent  = `Good ${greet}, ${firstName} 👋`;
const now = new Date();
document.getElementById('greetingDate').textContent = `Here's what your day looks like — ${now.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}`;

// Stats
const total  = tasks.length;
const done   = tasks.filter(t=>t.status==='Done').length;
const pending= tasks.filter(t=>t.status==='Pending').length;
const inProg = tasks.filter(t=>t.status==='In Progress').length;
const pct    = total > 0 ? Math.round(done/total*100) : 0;
const maxStr = habits.length ? Math.max(...habits.map(h=>h.streak)) : 0;

document.getElementById('statsGrid').innerHTML = `
  <div class="stat-card stat-amber"><div class="stat-label">Total Tasks</div><div class="stat-value">${total}</div><div class="stat-sub">Across all categories</div><div class="stat-icon">📋</div></div>
  <div class="stat-card stat-sage"><div class="stat-label">Completed</div><div class="stat-value">${done}</div><div class="stat-sub">${pct}% completion rate</div><div class="stat-icon">✅</div></div>
  <div class="stat-card stat-rose"><div class="stat-label">Pending</div><div class="stat-value">${pending}</div><div class="stat-sub">${inProg} in progress</div><div class="stat-icon">⏳</div></div>
  <div class="stat-card stat-sky"><div class="stat-label">Habits Active</div><div class="stat-value">${habits.length}</div><div class="stat-sub">Longest streak: ${maxStr} days</div><div class="stat-icon">🔥</div></div>
`;

document.getElementById('completionBadge').textContent = `${pct}% done`;
document.getElementById('donutPct').textContent = `${pct}%`;

document.getElementById('progressBars').innerHTML = `
  <div style="display:flex;flex-direction:column;gap:12px;">
    <div>
      <div style="display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:4px;">
        <span style="display:flex;align-items:center;gap:6px;"><span style="width:10px;height:10px;border-radius:50%;background:var(--sage);display:inline-block;"></span>Completed</span>
        <strong>${done}</strong>
      </div>
      <div class="progress-bar-wrap"><div class="progress-bar green" style="width:${pct}%"></div></div>
    </div>
    <div>
      <div style="display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:4px;">
        <span style="display:flex;align-items:center;gap:6px;"><span style="width:10px;height:10px;border-radius:50%;background:var(--amber);display:inline-block;"></span>In Progress</span>
        <strong>${inProg}</strong>
      </div>
      <div class="progress-bar-wrap"><div class="progress-bar" style="width:${total?Math.round(inProg/total*100):0}%"></div></div>
    </div>
    <div>
      <div style="display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:4px;">
        <span style="display:flex;align-items:center;gap:6px;"><span style="width:10px;height:10px;border-radius:50%;background:var(--rose);display:inline-block;"></span>Pending</span>
        <strong>${pending}</strong>
      </div>
      <div class="progress-bar-wrap"><div class="progress-bar red" style="width:${total?Math.round(pending/total*100):0}%"></div></div>
    </div>
  </div>`;

// Today's tasks (pending/in-progress, top 5)
const todayTasks = tasks.filter(t=>t.status!=='Done').slice(0,5);
document.getElementById('todayTasksList').innerHTML = todayTasks.length === 0
  ? '<div class="empty-state"><div class="empty-icon">🎉</div><p>All tasks completed!</p></div>'
  : todayTasks.map(t=>`
    <div class="task-item">
      <div class="task-check ${t.status==='Done'?'done':''}"></div>
      <div class="task-body">
        <div class="task-title ${t.status==='Done'?'done':''}">${t.title}</div>
        <div class="task-meta"><span>📁 ${t.category}</span><span>📅 ${t.due}</span></div>
        ${t.progress>0?`<div class="progress-bar-wrap" style="margin-top:6px;"><div class="progress-bar ${t.progress>=100?'green':''}" style="width:${t.progress}%"></div></div>`:''}
      </div>
      <div class="task-priority priority-${t.priority.toLowerCase()}">${t.priority}</div>
    </div>`).join('');

// Calendar
const calNow = new Date();
document.getElementById('calTitle').textContent = calNow.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
const firstDay = new Date(calNow.getFullYear(), calNow.getMonth(), 1).getDay();
const totalDays = new Date(calNow.getFullYear(), calNow.getMonth()+1, 0).getDate();
const today = calNow.getDate();
const eventDays = [4,7,9,12,15,18,22];
let calHTML = ['Su','Mo','Tu','We','Th','Fr','Sa'].map(d=>`<div class="cal-day-name">${d}</div>`).join('');
for (let i=0;i<firstDay;i++) calHTML += `<div class="cal-day empty"></div>`;
for (let d=1;d<=totalDays;d++) {
  let cls = d===today ? 'today' : eventDays.includes(d) ? 'has-event' : '';
  calHTML += `<div class="cal-day ${cls}">${d}</div>`;
}
document.getElementById('calGrid').innerHTML = calHTML;

// Top streaks
const topHabits = [...habits].sort((a,b)=>b.streak-a.streak).slice(0,3);
document.getElementById('topStreaks').innerHTML = topHabits.map(h=>`
  <div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--border);">
    <span style="font-size:1.3rem;">${h.icon}</span>
    <div style="flex:1;">
      <div style="font-size:.88rem;font-weight:600;">${h.name}</div>
      <div class="progress-bar-wrap" style="margin-top:4px;">
        <div class="progress-bar ${h.streak>=h.target?'green':''}" style="width:${Math.round(h.streak/h.target*100)}%"></div>
      </div>
    </div>
    <div style="text-align:right;">
      <div style="font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:700;color:var(--amber);">${h.streak}</div>
      <div style="font-size:.7rem;color:var(--ink-muted);">days</div>
    </div>
  </div>`).join('');

// Charts
const donutCtx = document.getElementById('donutChart').getContext('2d');
new Chart(donutCtx, {
  type:'doughnut',
  data:{ labels:['Completed','In Progress','Pending'],
    datasets:[{ data:[done,inProg,pending], backgroundColor:['#6B8F6E','#D4822A','#C96B6B'], borderWidth:0, hoverOffset:6 }] },
  options:{ responsive:true, maintainAspectRatio:true, cutout:'72%', plugins:{legend:{display:false}} }
});

const catCounts = {};
tasks.forEach(t=>{ catCounts[t.category]=(catCounts[t.category]||0)+1; });
const barCtx = document.getElementById('barChart').getContext('2d');
new Chart(barCtx, {
  type:'bar',
  data:{ labels:Object.keys(catCounts),
    datasets:[{ label:'Tasks', data:Object.values(catCounts), backgroundColor:['#F5C67F','#6B8F6E','#4A7FA5'], borderRadius:8, borderSkipped:false }] },
  options:{
    responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}},
    scales:{
      x:{grid:{display:false},ticks:{font:{family:'DM Sans',size:12}}},
      y:{beginAtZero:true,grid:{color:'#E8E2D9'},ticks:{stepSize:1,font:{family:'DM Sans',size:12}}}
    }
  }
});
</script>

</body>
</html>
