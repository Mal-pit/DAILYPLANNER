<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DayFlow Habits – Track your daily habits and streaks.">
  <title>Habits – DayFlow</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>.habit-card:hover { box-shadow:0 6px 24px var(--shadow-md); transform:translateY(-2px); }</style>
</head>
<body>
<div class="app-layout">

  <div id="sidebarContainer"></div>

  <div class="main-content">
    <div id="topbarContainer"></div>

    <main class="page-content">

      <div id="flashMsg"></div>

      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;" class="fade-in">
        <div>
          <h2 style="font-size:1.6rem;">Habit Tracker</h2>
          <p style="color:var(--ink-muted);font-size:.88rem;">Build consistent routines, one day at a time</p>
        </div>
        <button class="btn btn-primary" onclick="openModal('addHabitModal')">+ Add Habit</button>
      </div>

      <!-- Stats -->
      <div class="stats-grid fade-in" style="margin-bottom:24px;" id="habitStats"></div>

      <!-- Main content -->
      <div class="two-col fade-in-2">
        <div class="card">
          <div class="card-header">
            <h3>My Habits</h3>
            <span class="badge badge-amber" id="habitCountBadge"></span>
          </div>
          <div class="card-body" id="habitCards"></div>
        </div>

        <div style="display:flex;flex-direction:column;gap:22px;">
          <div class="card">
            <div class="card-header"><h3>Streak Comparison</h3></div>
            <div class="card-body"><canvas id="streakChart" style="max-height:240px;"></canvas></div>
          </div>
          <div class="card">
            <div class="card-header"><h3>Habits Overview</h3></div>
            <div class="table-wrapper">
              <table>
                <thead>
                  <tr><th>Habit</th><th>Category</th><th>Streak</th><th>Goal</th><th>Progress</th><th>Actions</th></tr>
                </thead>
                <tbody id="habitTable"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

    </main>
    <div id="footerContainer"></div>
  </div>
</div>

<!-- Add Habit Modal -->
<div class="modal-overlay" id="addHabitModal">
  <div class="modal">
    <div class="modal-header">
      <h3>Add New Habit</h3>
      <button class="modal-close" onclick="closeModal('addHabitModal')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Habit Name *</label>
        <input type="text" id="add_habit_name" placeholder="e.g. Walk 30 Minutes" required>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
        <div class="form-group">
          <label>Category</label>
          <select id="add_habit_category">
            <option value="Health">Health</option>
            <option value="Work">Work</option>
            <option value="Personal">Personal</option>
          </select>
        </div>
        <div class="form-group">
          <label>Monthly Goal (days)</label>
          <input type="number" id="add_habit_target" value="30" min="1" max="365">
        </div>
      </div>
      <div class="form-group">
        <label>Icon (emoji)</label>
        <input type="text" id="add_habit_icon" placeholder="e.g. 🏃" maxlength="4">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('addHabitModal')">Cancel</button>
      <button class="btn btn-primary" onclick="addHabit()">Add Habit</button>
    </div>
  </div>
</div>

<!-- Edit Habit Modal -->
<div class="modal-overlay" id="editHabitModal">
  <div class="modal">
    <div class="modal-header">
      <h3>Edit Habit</h3>
      <button class="modal-close" onclick="closeModal('editHabitModal')">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="edit_habit_id">
      <div class="form-group">
        <label>Habit Name *</label>
        <input type="text" id="edit_habit_name" required>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
        <div class="form-group">
          <label>Category</label>
          <select id="edit_habit_category">
            <option value="Health">Health</option>
            <option value="Work">Work</option>
            <option value="Personal">Personal</option>
          </select>
        </div>
        <div class="form-group">
          <label>Monthly Goal (days)</label>
          <input type="number" id="edit_habit_target" min="1" max="365">
        </div>
      </div>
      <div class="form-group">
        <label>Current Streak (days)</label>
        <input type="number" id="edit_habit_streak" min="0">
      </div>
      <div class="form-group">
        <label>Icon (emoji)</label>
        <input type="text" id="edit_habit_icon" maxlength="4">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('editHabitModal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveHabit()">Save Changes</button>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script>
requireAuth();
document.getElementById('sidebarContainer').innerHTML = renderSidebar('habits.html');
document.getElementById('topbarContainer').innerHTML  = renderTopbar('Habit Tracker');
document.getElementById('footerContainer').innerHTML  = renderFooter();

let streakChart = null;
const catColors  = { Health:'sage', Work:'sky', Personal:'amber' };
const catBadges  = { Health:'badge-sage', Work:'badge-sky', Personal:'badge-amber' };

function flash(msg, type='success') {
  const el = document.getElementById('flashMsg');
  el.innerHTML = `<div class="form-${type} fade-in">${msg}</div>`;
  setTimeout(()=>el.innerHTML='', 3000);
}

function renderHabits() {
  const habits = getHabits();
  const total  = habits.length;
  const avgStr = total ? Math.round(habits.reduce((s,h)=>s+h.streak,0)/total) : 0;
  const maxStr = total ? Math.max(...habits.map(h=>h.streak)) : 0;
  const topH   = habits.find(h=>h.streak===maxStr) || { icon:'🏆', name:'-' };
  const cats   = new Set(habits.map(h=>h.category));

  document.getElementById('habitStats').innerHTML = `
    <div class="stat-card stat-amber"><div class="stat-label">Total Habits</div><div class="stat-value">${total}</div><div class="stat-sub">Active routines</div><div class="stat-icon">📋</div></div>
    <div class="stat-card stat-rose"><div class="stat-label">Avg Streak</div><div class="stat-value">${avgStr}</div><div class="stat-sub">Days average</div><div class="stat-icon">📈</div></div>
    <div class="stat-card stat-sage"><div class="stat-label">Longest Streak</div><div class="stat-value">${maxStr}</div><div class="stat-sub">${topH.icon} ${topH.name}</div><div class="stat-icon">🔥</div></div>
    <div class="stat-card stat-sky"><div class="stat-label">Categories</div><div class="stat-value">${cats.size}</div><div class="stat-sub">Health, Work, Personal</div><div class="stat-icon">🗂️</div></div>
  `;

  document.getElementById('habitCountBadge').textContent = `${total} habits`;

  if (!total) {
    document.getElementById('habitCards').innerHTML = `<p style="text-align:center;color:var(--ink-muted);padding:32px;">No habits yet. Add your first one!</p>`;
    document.getElementById('habitTable').innerHTML = '';
    return;
  }

  document.getElementById('habitCards').innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;">
      ${habits.map(h => {
        const pct = h.target > 0 ? Math.round(h.streak/h.target*100) : 0;
        const cc  = catColors[h.category] || 'amber';
        return `<div style="background:var(--cream);border:1.5px solid var(--border);border-radius:var(--radius);padding:18px;transition:box-shadow .2s,transform .2s;" class="habit-card">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;">
            <div style="display:flex;align-items:center;gap:10px;">
              <span style="font-size:1.6rem;">${h.icon||'⭐'}</span>
              <div>
                <div style="font-weight:600;font-size:.92rem;">${h.name}</div>
                <span class="badge badge-${cc}" style="margin-top:2px;">${h.category}</span>
              </div>
            </div>
            <div style="display:flex;gap:4px;">
              <button class="btn btn-secondary btn-sm" onclick='openEditHabit(${JSON.stringify(h)})' style="padding:2px 7px;font-size:.75rem;" title="Edit">✏️</button>
              <button class="btn btn-sm" style="background:var(--rose);color:#fff;border-color:var(--rose);padding:2px 7px;font-size:.75rem;" onclick="deleteHabit(${h.id})" title="Delete">🗑️</button>
            </div>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:8px;">
            <div>
              <div style="font-size:.75rem;color:var(--ink-muted);">Current streak</div>
              <div style="font-family:'Playfair Display',serif;font-size:1.6rem;font-weight:700;color:var(--amber);line-height:1;">${h.streak} <span style="font-size:.85rem;font-family:'DM Sans',sans-serif;color:var(--ink-muted);">days</span></div>
            </div>
            <div style="text-align:right;">
              <div style="font-size:.75rem;color:var(--ink-muted);">Goal</div>
              <div style="font-size:.9rem;font-weight:600;">${h.target} days</div>
            </div>
          </div>
          <div class="progress-bar-wrap"><div class="progress-bar ${pct>=100?'green':''}" style="width:${Math.min(pct,100)}%"></div></div>
          <div style="font-size:.75rem;color:var(--ink-muted);margin-top:5px;text-align:right;">${pct}% of goal</div>
        </div>`;
      }).join('')}
    </div>`;

  // Table
  document.getElementById('habitTable').innerHTML = habits.map(h => {
    const pct = h.target > 0 ? Math.round(h.streak/h.target*100) : 0;
    return `<tr>
      <td><span style="font-size:1.1rem;">${h.icon||'⭐'}</span> ${h.name}</td>
      <td><span class="badge ${catBadges[h.category]||'badge-muted'}">${h.category}</span></td>
      <td><strong style="color:var(--amber);">${h.streak}</strong> days</td>
      <td>${h.target} days</td>
      <td style="min-width:80px;">
        <div style="font-size:.78rem;margin-bottom:3px;">${pct}%</div>
        <div class="progress-bar-wrap" style="height:6px;"><div class="progress-bar ${pct>=100?'green':''}" style="width:${Math.min(pct,100)}%"></div></div>
      </td>
      <td>
        <div style="display:flex;gap:5px;">
          <button class="btn btn-secondary btn-sm" onclick='openEditHabit(${JSON.stringify(h)})' style="padding:3px 8px;" title="Edit">✏️</button>
          <button class="btn btn-sm" style="background:var(--rose);color:#fff;border-color:var(--rose);padding:3px 8px;" onclick="deleteHabit(${h.id})" title="Delete">🗑️</button>
        </div>
      </td>
    </tr>`;
  }).join('');

  // Streak chart
  const labels = habits.map(h=>`${h.icon||''} ${h.name.slice(0,12)}`);
  if (streakChart) {
    streakChart.data.labels = labels;
    streakChart.data.datasets[0].data = habits.map(h=>h.streak);
    streakChart.data.datasets[1].data = habits.map(h=>h.target);
    streakChart.update();
  } else {
    const ctx = document.getElementById('streakChart').getContext('2d');
    streakChart = new Chart(ctx, {
      type:'bar',
      data:{
        labels,
        datasets:[
          { label:'Current Streak', data:habits.map(h=>h.streak), backgroundColor:'#D4822A', borderRadius:6 },
          { label:'Goal',           data:habits.map(h=>h.target), backgroundColor:'rgba(212,130,42,.15)', borderRadius:6 }
        ]
      },
      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{labels:{font:{family:'DM Sans',size:12},boxWidth:12,padding:14}} },
        scales:{
          x:{grid:{display:false},ticks:{font:{family:'DM Sans',size:11}}},
          y:{beginAtZero:true,grid:{color:'#E8E2D9'},ticks:{font:{family:'DM Sans'}}}
        }
      }
    });
  }
}

function addHabit() {
  const name = document.getElementById('add_habit_name').value.trim();
  if (!name) { alert('Please enter a habit name.'); return; }
  const habits = getHabits();
  habits.push({
    id:       nextId(habits),
    name,
    icon:     document.getElementById('add_habit_icon').value.trim() || '⭐',
    category: document.getElementById('add_habit_category').value,
    target:   parseInt(document.getElementById('add_habit_target').value)||30,
    streak:   0,
  });
  saveHabits(habits);
  closeModal('addHabitModal');
  document.getElementById('add_habit_name').value = '';
  document.getElementById('add_habit_icon').value = '';
  renderHabits();
  flash('✅ Habit added!');
}

function openEditHabit(h) {
  document.getElementById('edit_habit_id').value     = h.id;
  document.getElementById('edit_habit_name').value   = h.name;
  document.getElementById('edit_habit_target').value = h.target;
  document.getElementById('edit_habit_icon').value   = h.icon||'';
  document.getElementById('edit_habit_streak').value = h.streak;
  setSelectValue('edit_habit_category', h.category);
  openModal('editHabitModal');
}

function saveHabit() {
  const id     = parseInt(document.getElementById('edit_habit_id').value);
  const habits = getHabits();
  const idx    = habits.findIndex(h=>h.id===id);
  if (idx < 0) return;
  habits[idx] = {
    ...habits[idx],
    name:     document.getElementById('edit_habit_name').value.trim(),
    category: document.getElementById('edit_habit_category').value,
    target:   parseInt(document.getElementById('edit_habit_target').value)||30,
    streak:   parseInt(document.getElementById('edit_habit_streak').value)||0,
    icon:     document.getElementById('edit_habit_icon').value.trim()||habits[idx].icon,
  };
  saveHabits(habits);
  closeModal('editHabitModal');
  renderHabits();
  flash('✏️ Habit updated!');
}

function deleteHabit(id) {
  if (!confirm('Delete this habit?')) return;
  saveHabits(getHabits().filter(h=>h.id!==id));
  renderHabits();
  flash('🗑️ Habit deleted.','error');
}

renderHabits();
</script>
</body>
</html>
